<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>FlowSense</title>

<style>

body{
    font-family:Arial;
    text-align:center;
    background:#f4f4f4;
}

.card{

    width:300px;
    margin:30px auto;

    background:white;

    border-radius:10px;

    padding:20px;

    box-shadow:
    0 0 10px rgba(
        0,0,0,0.2
    );
}

.numero{

    font-size:60px;
    font-weight:bold;
}

.status{

    font-size:24px;
    margin-top:10px;
}

.barra{

    width:100%;
    height:30px;

    background:#ddd;

    border-radius:20px;

    overflow:hidden;
}

.progresso{

    height:100%;
    width:0%;

    transition:0.5s;
}

</style>

</head>

<body>

<h1>FlowSense</h1>

<div class="card">

    <h2>Pessoas no Ambiente</h2>

    <div
        id="ocupacao"
        class="numero">
        0
    </div>

    <p>
      Capacidade:
      <span id="capacidade">
      5
      </span>
    </p>

    <div class="barra">

        <div
            id="progresso"
            class="progresso">
        </div>

    </div>

    <h3
        id="percentual">
        0%
    </h3>

    <div
        id="status"
        class="status">

        LIVRE

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

socket.on(
    "novoDado",
    dados => {

        document
            .getElementById(
                "ocupacao"
            )
            .innerText =
            dados.ocupacao;

        document
            .getElementById(
                "capacidade"
            )
            .innerText =
            dados.capacidade;

        document
            .getElementById(
                "percentual"
            )
            .innerText =
            dados.percentual.toFixed(0)
            + "%";

        const barra =
            document.getElementById(
                "progresso"
            );

        barra.style.width =
            dados.percentual + "%";

        const status =
            document.getElementById(
                "status"
            );

        status.innerText =
            dados.status;

        if(
            dados.status ===
            "LOTADO"
        ){

            barra.style.background =
                "red";

            status.style.color =
                "red";
        }
        else if(
            dados.status ===
            "ATENÇÃO"
        ){

            barra.style.background =
                "orange";

            status.style.color =
                "orange";
        }
        else{

            barra.style.background =
                "green";

            status.style.color =
                "green";
        }
    }
);

</script>

</body>

</html>
